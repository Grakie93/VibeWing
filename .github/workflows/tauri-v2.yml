name: Build VibeWing (Tauri)

on:
  workflow_dispatch:
  push:
    tags: ['v2.*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - run: npm run tauri build -- --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: VibeWing-${{ runner.os }}
          path: v2/src-tauri/target/${{ matrix.target }}/release/bundle/**
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            v2/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            v2/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            v2/src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
          generate_release_notes: true
