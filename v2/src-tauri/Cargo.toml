[package]
name = "vibewing"
version = "2.1.2"
description = "A lightweight desktop workspace for vibe coding projects"
authors = ["Grakie93"]
license = "MIT"
repository = "https://github.com/Grakie93/VibeWing"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "vibewing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["time", "sync"] }
futures-util = "0.3"
url = "2"
aes-gcm = "0.10"
pbkdf2 = "0.12"
sha2 = "0.10"
rand = "0.8"
base64ct = { version = "1", features = ["alloc"] }
semver = "1"
# Process tree inspection for the "why does one service show up as N
# processes?" view. Chosen over shelling out to `ps`/`wmic`/PowerShell because
# it is the only cross-platform way to get parent pids from Rust without
# hand-written Win32 FFI.
sysinfo = "0.30"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
