[package]
name = "vibewing"
version = "2.0.0"
description = "A lightweight desktop workspace for vibe coding projects"
authors = ["Grakie93"]
license = "MIT"
repository = "https://github.com/Grakie93/VibeWing"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "vibewing_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
