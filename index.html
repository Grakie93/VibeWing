.messages,.service-log,.git-scroll,#git_files,.git-legend-fixed,.git-legend,.sent-log-content,.log-attachment-content{background:var(--panel-deep)!important;border-color:var(--theme-border)!important}
.assistant .bubble,.model-row,.provider-tab-wrap,.markdown-body th,.markdown-body blockquote{background:var(--panel)!important}
.composer-wrap,.chat-main textarea,.settings-select,input,#git_branch,.git-message-wrap textarea,.composer-wrap .composer-model{background:var(--control)!important;border-color:var(--theme-border)!important}
.git-lang-switch,.context-menu{background:var(--panel)!important;border-color:var(--theme-border)!important}
.service-log{user-select:text!important;-webkit-user-select:text!important;cursor:text!important}

.color-setting{display:grid!important;grid-template-columns:minmax(max-content,1fr) 44px 72px;align-items:center;gap:10px;min-width:0;white-space:nowrap}
.color-setting input[type=color]{min-width:44px!important;width:44px!important}
.color-setting code{min-width:72px;margin:0!important;text-align:right;overflow:visible}
.provider-tab-label,.provider-tab-wrap.active .provider-tab-label{color:#fff!important}
#settings>.box{width:min(980px,calc(100% - 30px))!important}
.log-selection-menu{display:none;position:fixed;z-index:21;gap:6px;padding:6px;border:1px solid var(--theme-border);border-radius:11px;background:var(--panel);box-shadow:0 10px 28px #0007}
.log-selection-menu.on{display:flex}.log-selection-menu .btn{white-space:nowrap}
.agent-action-card{margin-top:9px;padding:11px;border:1px solid var(--theme-border);border-radius:11px;background:var(--panel-deep);text-align:left}.agent-action-title{font-weight:700;color:var(--text);margin-bottom:6px}.agent-action-meta{font-size:12px;color:var(--muted);line-height:1.65;white-space:normal}.agent-action-buttons{display:flex;gap:7px;justify-content:flex-end;margin-top:9px}.agent-action-result{margin-top:8px;color:var(--muted);font-size:12px;white-space:pre-wrap}
#chat .chat-box{height:min(760px,calc(100vh - 30px));display:flex;flex-direction:column;overflow:hidden}
#chat .chat-layout{flex:1;min-height:0}
#chat .chat-list{height:100%}
#chat .chat-main{display:flex;min-height:0;flex-direction:column}
#chat .messages{height:auto;min-height:0;flex:1}
#chat .composer-wrap textarea{min-height:48px!important;max-height:82px!important;padding:10px 4px 6px!important}
#chat .bubble.thinking{display:inline-flex;width:auto;min-width:0;max-width:none;padding:10px 12px;gap:5px}
#chat .context-menu{left:10px;bottom:48px;top:auto;margin:0;z-index:12;max-width:calc(100% - 20px);box-shadow:0 -10px 30px #0007}

.grid{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid>.card,.card .svc{min-width:0;width:100%}
